server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # proxy /api/* para o container da API
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # proxy /auth/* para o container da API (OAuth flow)
    location /auth/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: qualquer rota nao-ficheiro devolve index.html
    # necessario para o React Router funcionar (refresh em /dashboard, etc.)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
